name: Build Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install documentation dependencies
        run: pip install --requirement .github/requirements.txt

      - name: Build website with ProperDocs
        run: properdocs build --strict

      - name: Add COMPAS API documentation
        run: |
          git clone --depth 1 --single-branch --branch docs/compas \
            https://github.com/StrucEng-Library-kfmresearch/strucenglib-website.git compas
          mkdir -p site/docs
          cp -R compas/docs/. site/docs/

      - name: Add COMPAS FEA API documentation
        run: |
          git clone --depth 1 --single-branch --branch docs/compas_fea \
            https://github.com/StrucEng-Library-kfmresearch/strucenglib-website.git compas_fea
          mkdir -p site/docs
          cp -R compas_fea/docs/. site/docs/

      - name: Deploy website to GitHub Pages
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: strucenglib.ethz.ch
